# Bağımlılıklar ve Action sürümleri için haftalık güncelleme pull request'leri açar.
# Her biri CI'dan geçmeden birleştirilmemeli.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
